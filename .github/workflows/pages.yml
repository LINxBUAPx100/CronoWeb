# Despliegue de CronoWeb en GitHub Pages.
#
# Por qué un workflow y no el builder clásico: el builder «legacy» corre Jekyll
# sobre el repositorio y, cuando se atora, no deja ni log ni mensaje de error —
# el sitio simplemente responde 404 mientras el estado dice «building» para
# siempre. Este workflow publica el repositorio tal cual, con log visible en la
# pestaña Actions, y falla ruidosamente si algo va mal.
#
# REQUIERE UNA VEZ: Settings → Pages → Source: **GitHub Actions**.
#
# Mientras esa opción siga en «Deploy from a branch», este workflow NO puede
# publicar: `actions/deploy-pages` sólo acepta despliegues cuando la fuente es
# Actions, y además GitHub sigue lanzando en paralelo su builder de Jekyll
# («pages build and deployment»), que es el que aparece fallando en la pestaña
# Actions sin log útil. Cambiar la fuente apaga ese builder y habilita éste.
#
# UN SOLO JOB a propósito. Con dos (verificar → publicar) hay que arrancar dos
# runners y resolver el doble de acciones desde el CDN de GitHub; cuando ese CDN
# falla —«Failed to resolve action download info: Service Unavailable»— el
# despliegue se cae por algo que no tiene nada que ver con el código. Menos
# pasos = menos superficie para una incidencia del servicio, y la mitad de
# tiempo. Si aun así falla con «Service Unavailable», es de GitHub: basta con
# «Re-run jobs».
#
# CronoWeb no tiene build: el sitio ES el repositorio (HTML + ES modules + CSS +
# fuentes y html2canvas versionados).

name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite relanzar el despliegue a mano

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    name: Verificar y publicar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Node ya viene instalado en el runner de Ubuntu; usarlo directo evita
      # una acción más que resolver.
      - name: Pruebas del motor y del editor
        run: node tools/verify-engine.mjs

      - name: Pruebas del modelo de captura
        run: node tools/verify-model.mjs

      - name: Comprobar que están los archivos que el sitio necesita
        run: |
          set -e
          touch .nojekyll   # si alguien lo borra, Pages ignoraría carpetas con "_"
          for f in index.html assets/css/app.css assets/js/main.js \
                   assets/vendor/html2canvas.min.js \
                   backend/samples/demo_secundaria.json; do
            test -f "$f" || { echo "FALTA: $f"; exit 1; }
          done
          test -n "$(ls assets/fonts/*.woff2 2>/dev/null)" || { echo "FALTAN las tipografías"; exit 1; }
          echo "Todo en su lugar."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
